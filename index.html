<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Rust Map Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0c; color: #e8e6e3; overflow: hidden; }
    #canvas-container { position: fixed; inset: 0; }
    #ui {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(10, 10, 14, 0.75); backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 12px;
      padding: 16px; width: 300px; font-size: 13px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #ui h1 {
      font-size: 18px; margin-bottom: 4px; color: #d4af37;
      letter-spacing: 0.5px;
    }
    #ui .subtitle { font-size: 11px; color: #888; margin-bottom: 12px; }
    label { display: block; margin: 10px 0 4px; color: #bbb; font-size: 12px; }
    input[type="range"] { width: 100%; accent-color: #d4af37; }
    input[type="file"] { width: 100%; margin: 4px 0 8px; font-size: 12px; }
    button {
      background: #d4af37; color: #111; border: none; padding: 8px 14px;
      border-radius: 6px; cursor: pointer; font-weight: 600; margin: 4px 4px 4px 0;
      transition: all 0.15s;
    }
    button:hover { background: #f0d060; transform: translateY(-1px); }
    button.secondary { background: #2a2a32; color: #ddd; }
    button.secondary:hover { background: #3a3a44; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .info { font-size: 11px; color: #777; margin-top: 10px; line-height: 1.4; }
    #status { font-size: 12px; color: #d4af37; margin-top: 8px; min-height: 18px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui">
    <h1>3D Rust Map Viewer</h1>
    <div class="subtitle">Tilt · Zoom · Explore from any angle</div>

    <label>Heightmap (PNG, grayscale)</label>
    <input type="file" id="heightmap" accept="image/png,image/jpeg">
    <label>Texture / Satellite (PNG)</label>
    <input type="file" id="texture" accept="image/png,image/jpeg">

    <div class="row">
      <button id="load-btn">Load Map</button>
      <button id="demo-btn" class="secondary">Demo Island</button>
    </div>

    <label>Vertical Exaggeration <span id="exag-val">1.8</span></label>
    <input type="range" id="exaggeration" min="0.5" max="4" step="0.1" value="1.8">

    <label>Water Level <span id="water-val">0</span></label>
    <input type="range" id="water" min="-20" max="40" step="1" value="0">

    <div class="row">
      <button id="reset-cam" class="secondary">Reset Camera</button>
      <button id="wireframe" class="secondary">Wireframe</button>
    </div>

    <div id="status">Ready — load a heightmap or try the demo</div>
    <div class="info">
      Left-drag: orbit · Right-drag: pan · Scroll: zoom<br>
      Best with a real Rust heightmap + satellite image.
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const container = document.getElementById('canvas-container');
    const statusEl = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c12);
    scene.fog = new THREE.Fog(0x0a0c12, 800, 4500);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 10000);
    camera.position.set(0, 420, 680);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 40;
    controls.maxDistance = 2500;

    // Lighting
    const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3a2a1a, 0.6);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff4e0, 1.1);
    sun.position.set(400, 700, 200);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 2000;
    sun.shadow.camera.left = sun.shadow.camera.bottom = -800;
    sun.shadow.camera.right = sun.shadow.camera.top = 800;
    scene.add(sun);

    let terrain, water, currentHeightData = null, terrainSize = 512;
    let wireframeMode = false;

    function createTerrainFromHeightData(heightData, size, textureImage = null, exaggeration = 1.8) {
      if (terrain) scene.remove(terrain);
      if (water) scene.remove(water);

      const geometry = new THREE.PlaneGeometry(size, size, 256, 256);
      geometry.rotateX(-Math.PI / 2);

      const positions = geometry.attributes.position;
      const minH = Math.min(...heightData);
      const maxH = Math.max(...heightData);
      const range = maxH - minH || 1;

      for (let i = 0; i < positions.count; i++) {
        const u = (positions.getX(i) / size + 0.5);
        const v = (positions.getZ(i) / size + 0.5);
        const ix = Math.min(Math.floor(u * (heightData.length ** 0.5 - 1)), Math.sqrt(heightData.length) - 1);
        const iy = Math.min(Math.floor(v * (heightData.length ** 0.5 - 1)), Math.sqrt(heightData.length) - 1);
        const h = heightData[iy * Math.sqrt(heightData.length) + ix];
        const normalized = (h - minH) / range;
        positions.setY(i, normalized * 120 * exaggeration);
      }
      geometry.computeVertexNormals();

      let material;
      if (textureImage) {
        const tex = new THREE.Texture(textureImage);
        tex.needsUpdate = true;
        tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
        material = new THREE.MeshStandardMaterial({
          map: tex,
          roughness: 0.85,
          metalness: 0.05,
          wireframe: wireframeMode
        });
      } else {
        // Height-colored material
        material = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.8,
          metalness: 0.05,
          wireframe: wireframeMode
        });
        const colors = [];
        for (let i = 0; i < positions.count; i++) {
          const y = positions.getY(i);
          const t = y / (120 * exaggeration);
          const color = new THREE.Color();
          if (t < 0.15) color.setHSL(0.55, 0.6, 0.35); // deep water / low
          else if (t < 0.3) color.setHSL(0.12, 0.45, 0.45); // sand
          else if (t < 0.55) color.setHSL(0.25, 0.5, 0.4); // grass
          else if (t < 0.75) color.setHSL(0.08, 0.3, 0.35); // rock
          else color.setHSL(0.0, 0.0, 0.85); // snow
          colors.push(color.r, color.g, color.b);
        }
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      }

      terrain = new THREE.Mesh(geometry, material);
      terrain.receiveShadow = true;
      terrain.castShadow = true;
      scene.add(terrain);

      // Water
      const waterGeo = new THREE.PlaneGeometry(size * 1.4, size * 1.4);
      waterGeo.rotateX(-Math.PI / 2);
      const waterMat = new THREE.MeshStandardMaterial({
        color: 0x1a4a6e,
        transparent: true,
        opacity: 0.65,
        roughness: 0.1,
        metalness: 0.3
      });
      water = new THREE.Mesh(waterGeo, waterMat);
      water.position.y = parseFloat(document.getElementById('water').value);
      scene.add(water);

      controls.target.set(0, 40, 0);
      camera.position.set(0, 380, 620);
      controls.update();
      statusEl.textContent = `Terrain loaded — ${Math.sqrt(heightData.length)} px heightmap`;
    }

    function generateDemoHeightmap(size = 257) {
      const data = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const nx = x / size - 0.5;
          const ny = y / size - 0.5;
          const dist = Math.sqrt(nx * nx + ny * ny) * 2;
          let h = Math.max(0, 1 - dist) * 0.7;
          h += Math.sin(x * 0.08) * Math.cos(y * 0.07) * 0.15;
          h += Math.sin(x * 0.25 + y * 0.15) * 0.08;
          h += (Math.random() - 0.5) * 0.04;
          data[y * size + x] = Math.max(0, h);
        }
      }
      return data;
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    async function loadFromFiles() {
      const hFile = document.getElementById('heightmap').files[0];
      const tFile = document.getElementById('texture').files[0];
      if (!hFile) {
        statusEl.textContent = 'Please select a heightmap image';
        return;
      }
      statusEl.textContent = 'Loading…';
      try {
        const hImg = await loadImage(hFile);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const size = Math.min(hImg.width, hImg.height, 1024);
        canvas.width = canvas.height = size;
        ctx.drawImage(hImg, 0, 0, size, size);
        const imageData = ctx.getImageData(0, 0, size, size);
        const heightData = new Float32Array(size * size);
        for (let i = 0; i < heightData.length; i++) {
          heightData[i] = imageData.data[i * 4] / 255;
        }
        let texImg = null;
        if (tFile) texImg = await loadImage(tFile);
        currentHeightData = heightData;
        terrainSize = size;
        const exag = parseFloat(document.getElementById('exaggeration').value);
        createTerrainFromHeightData(heightData, 900, texImg, exag);
      } catch (e) {
        statusEl.textContent = 'Error loading images';
        console.error(e);
      }
    }

    function loadDemo() {
      statusEl.textContent = 'Generating demo island…';
      const data = generateDemoHeightmap(257);
      currentHeightData = data;
      terrainSize = 257;
      const exag = parseFloat(document.getElementById('exaggeration').value);
      createTerrainFromHeightData(data, 900, null, exag);
    }

    document.getElementById('load-btn').onclick = loadFromFiles;
    document.getElementById('demo-btn').onclick = loadDemo;
    document.getElementById('reset-cam').onclick = () => {
      camera.position.set(0, 380, 620);
      controls.target.set(0, 40, 0);
      controls.update();
    };
    document.getElementById('wireframe').onclick = () => {
      wireframeMode = !wireframeMode;
      if (terrain) terrain.material.wireframe = wireframeMode;
    };

    document.getElementById('exaggeration').oninput = (e) => {
      document.getElementById('exag-val').textContent = e.target.value;
      if (currentHeightData) {
        const tex = terrain && terrain.material.map ? terrain.material.map.image : null;
        createTerrainFromHeightData(currentHeightData, 900, tex, parseFloat(e.target.value));
      }
    };
    document.getElementById('water').oninput = (e) => {
      document.getElementById('water-val').textContent = e.target.value;
      if (water) water.position.y = parseFloat(e.target.value);
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Auto-load demo on start
    setTimeout(loadDemo, 300);
  </script>
</body>
</html>
